name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('src/uv.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            operator/bin
          key: go-${{ runner.os }}-${{ hashFiles('operator/go.sum', 'operator/Makefile') }}
      - run: task setup
      - run: task check
      - run: task test:tads
      - run: task security:audit
      - name: Generated files are current
        run: |
          task operator:generate
          git add -A -- operator/api operator/config deploy/operator
          git diff --cached --exit-code --stat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports
          path: |
            reports/python*.xml
            reports/tads-*.xml
            reports/go-coverage.*
          if-no-files-found: warn
  kind:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [local-kind, edge, single-server, multi-server]
        runner: [ubuntu-24.04]
        include:
          - profile: edge
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: task kind:test PROFILE=${{ matrix.profile }}
      - name: Capture restricted diagnostics
        if: failure()
        run: uv run --project src python scripts/support_bundle.py --kubeconfig .local/tadoss.kubeconfig --namespace tads --output reports/support.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kind-${{ matrix.profile }}-${{ matrix.runner }}
          path: reports/
          if-no-files-found: warn
