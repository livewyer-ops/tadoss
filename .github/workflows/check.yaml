name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('operator/go.sum') }}
      - run: task setup
      - run: task check
      - name: Generated files are current
        run: |
          task operator:generate
          git add -A -- operator/api operator/config deploy/charts/tadoss-operator
          git diff --cached --exit-code --stat
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [local-kind, multi-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: task kind:test PROFILE=${{ matrix.profile }}
      - name: Capture diagnostics
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/.local/tadoss.kubeconfig
        run: |
          mkdir -p reports
          kubectl get nodes,pods,deployments,jobs,tadosses,clusters.postgresql.cnpg.io -A -o wide > reports/resources.txt || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp > reports/events.txt || true
          kubectl logs -n tadoss-system deployment/tadoss-operator --all-containers --tail=500 > reports/operator.log || true
          kind export logs reports/kind --name tadoss || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kind-${{ matrix.profile }}
          path: reports/
          if-no-files-found: warn
