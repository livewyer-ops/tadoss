name: Release
on:
  push:
    tags: [v*]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yaml
  candidate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      runtime: livewyer/tadoss-api@${{ steps.runtime.outputs.digest }}
      operator: livewyer/tadoss-operator@${{ steps.operator.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Check release metadata
        run: uv run --project src python scripts/release.py check
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: livewyer/tadoss-api:candidate-${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: livewyer/tadoss-api@${{ steps.runtime.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Embed exact runtime digest
        env:
          RUNTIME_IMAGE: livewyer/tadoss-api@${{ steps.runtime.outputs.digest }}
        run: uv run --project src python scripts/release.py catalogue --runtime-image "$RUNTIME_IMAGE"
      - id: operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: livewyer/tadoss-operator:candidate-${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: livewyer/tadoss-operator@${{ steps.operator.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Assemble exact release assets
        env:
          RUNTIME_IMAGE: livewyer/tadoss-api@${{ steps.runtime.outputs.digest }}
          OPERATOR_IMAGE: livewyer/tadoss-operator@${{ steps.operator.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Candidate pushes create repositories before a first-release lookup.
          task release:preflight
          task release:artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: dist/
  qualify:
    needs: candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [local-kind, edge, single-server, multi-server]
        runner: [ubuntu-24.04]
        include:
          - profile: edge
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Qualify immutable images
        env:
          RUNTIME_IMAGE: ${{ needs.candidate.outputs.runtime }}
          OPERATOR_IMAGE: ${{ needs.candidate.outputs.operator }}
          PROFILE: ${{ matrix.profile }}
        run: task kind:test
      - name: Capture restricted diagnostics
        if: failure()
        run: uv run --project src python scripts/support_bundle.py --kubeconfig .local/tadoss.kubeconfig --namespace tads --output reports/support.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-qualification-${{ matrix.profile }}-${{ matrix.runner }}
          path: reports/
          if-no-files-found: warn
  publish:
    needs: [candidate, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-candidate
          path: dist
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and publish qualified artifacts
        env:
          RUNTIME_IMAGE: ${{ needs.candidate.outputs.runtime }}
          OPERATOR_IMAGE: ${{ needs.candidate.outputs.operator }}
          GH_TOKEN: ${{ github.token }}
        run: |
          task release:preflight
          (cd dist && sha256sum --check SHA256SUMS)
          cosign sign --yes "$RUNTIME_IMAGE"
          cosign sign --yes "$OPERATOR_IMAGE"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --tag "livewyer/tadoss-api:$version" "$RUNTIME_IMAGE"
          docker buildx imagetools create --tag "livewyer/tadoss-operator:$version" "$OPERATOR_IMAGE"
          for image in "$RUNTIME_IMAGE" "$OPERATOR_IMAGE"; do
            repository="${image%@*}"
            actual=$(docker buildx imagetools inspect "$repository:$version" --format '{{.Manifest.Digest}}')
            test "$actual" = "${image#*@}"
          done
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease="${{ contains(github.ref_name, '-') }}" dist/*
