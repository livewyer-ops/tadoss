name: Performance
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per measured workload and concurrency level
        default: '5'
        required: true
        type: string
      repeats:
        description: Repetitions per workload and concurrency level
        default: '3'
        required: true
        type: string
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: task setup
      - name: Benchmark with OAuth and background worker
        env:
          DURATION: ${{ inputs.duration }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          task dev:db
          uv run --project src --frozen python scripts/performance.py --duration "$DURATION" --repeats "$REPEATS" --worker --allow-overload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-${{ matrix.runner }}
          path: |
            reports/performance/*.json
            reports/performance/*.metrics.txt
          if-no-files-found: warn
