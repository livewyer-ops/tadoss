apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backup-restores-persisted-events
  labels:
    test.tadoss.io/domain: operations
    test.tadoss.io/tier: standard
spec:
  catch:
  - describe:
      apiVersion: tadoss.livewyer.io/v1alpha1
      kind: Tadoss
  - get:
      apiVersion: batch/v1
      kind: Job
  - get:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
  - get:
      apiVersion: postgresql.cnpg.io/v1
      kind: Backup
  - get:
      apiVersion: postgresql.cnpg.io/v1
      kind: ScheduledBackup
  - events: {}
  - podLogs:
      selector: app.kubernetes.io/name=tadoss
      tail: 100
  - podLogs:
      selector: cnpg.io/cluster
      tail: 100
  - podLogs:
      namespace: tadoss-system
      selector: app.kubernetes.io/name=tadoss-operator
      tail: 100
  steps:
  - name: create-object-store
    try:
    - apply:
        file: store.yaml
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: create-bucket
          status:
            succeeded: 1
  - name: write-and-back-up
    try:
    - apply:
        file: source.yaml
    - assert:
        resource:
          apiVersion: tadoss.livewyer.io/v1alpha1
          kind: Tadoss
          metadata:
            name: journey
          status:
            phase: Ready
    - command:
        entrypoint: cat
        args: [../../fixtures/api_check.py]
        outputs:
        - name: apiCheck
          value: ($stdout)
    - apply:
        file: ../../fixtures/api-check.yaml
    - apply:
        file: ../../instance/lifecycle/resources/seed.yaml
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: seed
          status:
            succeeded: 1
    - apply:
        resource:
          apiVersion: postgresql.cnpg.io/v1
          kind: Backup
          metadata:
            name: verification-backup
          spec:
            cluster:
              name: journey-db
            method: barmanObjectStore
    - assert:
        resource:
          apiVersion: postgresql.cnpg.io/v1
          kind: Backup
          metadata:
            name: verification-backup
          status:
            phase: completed
  - name: recover-and-verify-api
    try:
    - apply:
        file: restored.yaml
    - assert:
        resource:
          apiVersion: tadoss.livewyer.io/v1alpha1
          kind: Tadoss
          metadata:
            name: recovered
          status:
            phase: Ready
    - apply:
        file: verify.yaml
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: verify-recovered
          status:
            succeeded: 1
  - name: retained-database-keeps-scheduled-backups
    try:
    - patch:
        resource:
          apiVersion: tadoss.livewyer.io/v1alpha1
          kind: Tadoss
          metadata:
            name: journey
          spec:
            deletionPolicy: Retain
    - delete:
        ref:
          apiVersion: tadoss.livewyer.io/v1alpha1
          kind: Tadoss
          name: journey
    - assert:
        resource:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: journey-db
            (ownerReferences == null || length(ownerReferences) == `0`): true
          status:
            readyInstances: 1
    - assert:
        resource:
          apiVersion: postgresql.cnpg.io/v1
          kind: ScheduledBackup
          metadata:
            name: journey-backup
            (ownerReferences == null || length(ownerReferences) == `0`): true
    - patch:
        bindings:
        - name: previousBackups
          value: (x_k8s_list($client, 'postgresql.cnpg.io/v1', 'Backup', $namespace).items[].metadata.uid)
        resource:
          apiVersion: postgresql.cnpg.io/v1
          kind: ScheduledBackup
          metadata:
            name: journey-backup
          spec:
            schedule: '*/10 * * * * *'
        outputs:
        - name: previousBackups
          value: ($previousBackups)
    - assert:
        timeout: 150s
        resource:
          apiVersion: postgresql.cnpg.io/v1
          kind: Backup
          metadata:
            labels:
              cnpg.io/scheduled-backup: journey-backup
            (contains($previousBackups, uid)): false
          status:
            phase: completed
  - name: stop-databases-before-namespace-cleanup
    try:
    - delete:
        ref:
          apiVersion: tadoss.livewyer.io/v1alpha1
          kind: Tadoss
          name: recovered
    - delete:
        ref:
          apiVersion: postgresql.cnpg.io/v1
          kind: ScheduledBackup
          name: journey-backup
    - delete:
        ref:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: journey-db
    # Finish CNPG shutdown before deleting the fixture namespace.
    - wait:
        apiVersion: v1
        kind: Pod
        selector: cnpg.io/cluster
        for:
          deletion: {}
