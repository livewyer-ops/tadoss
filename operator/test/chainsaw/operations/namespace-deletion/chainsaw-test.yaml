apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: namespace-deletion-releases-protected-instance
  labels:
    test.tadoss.io/domain: operations
    test.tadoss.io/tier: standard
spec:
  catch:
  - describe:
      apiVersion: tadoss.livewyer.io/v1alpha1
      kind: Tadoss
  - get:
      apiVersion: batch/v1
      kind: Job
  - events: {}
  - podLogs:
      selector: app.kubernetes.io/name=tadoss
      tail: 100
  - podLogs:
      namespace: tadoss-system
      selector: app.kubernetes.io/name=tadoss-operator
      tail: 100
  steps:
  - name: delete-namespace-with-protected-instance
    try:
    - apply:
        resource:
          apiVersion: tadoss.livewyer.io/v1alpha1
          kind: Tadoss
          metadata:
            name: protected
          spec:
            profile: local-kind
            deletionProtection: true
            version: 0.1.0-rc1
            api:
              image: ($values.apiImage)
            backends:
              db:
                providedBy: cnpg
                cnpg: {}
    - assert:
        resource:
          apiVersion: tadoss.livewyer.io/v1alpha1
          kind: Tadoss
          metadata:
            name: protected
            finalizers:
            - tadoss.livewyer.io/finalizer
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: ($namespace)
        timeout: 5m
    - wait:
        apiVersion: v1
        kind: Namespace
        name: ($namespace)
        timeout: 5m
        for:
          deletion: {}
    - error:
        resource:
          apiVersion: tadoss.livewyer.io/v1alpha1
          kind: Tadoss
          metadata:
            name: protected
            namespace: ($namespace)
