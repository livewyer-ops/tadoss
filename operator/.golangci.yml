version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    misspell:
      locale: UK
  exclusions:
    rules:
      # This annotation is part of cert-manager's public API.
      - linters: [misspell]
        source: 'cert-manager\.io/subject-organizations'
formatters:
  enable:
    - gofmt
    - goimports
