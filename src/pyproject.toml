[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tadoss"
dynamic = ["version"]
description = "Time Addressable Data Open Source Store"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.121,<1",
    "uvicorn>=0.34,<1",
    "jsonschema>=4.23,<5",
    "mediatimestamp>=5.2,<6",
    "psycopg[binary,pool]>=3.3,<4",
    "asgi-correlation-id>=4,<5",
    "python-json-logger>=3,<4",
    "pyjwt[crypto]>=2.10,<3",
    "prometheus-client>=0.21,<1",
    "httpx>=0.28,<1",
]

[project.scripts]
tadoss = "tadoss.__main__:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "opentelemetry-instrumentation-psycopg>=0.51b0,<1",
    "opentelemetry-sdk>=1.30,<2",
]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "httpx>=0.28,<1",
    "pyright>=1.1,<2",
    "pyyaml>=6,<7",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
include = ["tadoss*"]

[tool.setuptools.dynamic]
version = {attr = "tadoss.__version__"}

[tool.setuptools.package-data]
tadoss = ["release.json", "contract/*.json", "contract/*.md"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "SIM", "TD", "PERF"]
ignore = ["TD003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"**/operator/test/**" = ["S101"]

[tool.coverage.run]
source = ["tadoss"]
branch = true
omit = ["*/tadoss/__main__.py"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["app/tadoss"]
extraPaths = ["app"]
strict = [
    "app/tadoss/auth.py",
    "app/tadoss/application/records.py",
    "app/tadoss/application/events.py",
    "app/tadoss/api/dependencies.py",
]

[tool.pytest.ini_options]
markers = ["tadoss_security: TADOSS authentication or security policy"]
