[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tadoss"
version = "0.1.0"
description = "Time Addressable Data Open Source Store"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jsonschema>=4.23,<5",
    "mediatimestamp>=5.2,<6",
    "psycopg[binary,pool]>=3.3,<4",
    "asgi-correlation-id>=4,<5",
    "python-json-logger>=3,<4",
]

[project.scripts]
tadoss = "tadoss.__main__:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "opentelemetry-instrumentation-psycopg>=0.51b0,<1",
    "opentelemetry-sdk>=1.30,<2",
]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "httpx>=0.28,<1",
    "pyright>=1.1,<2",
    "pyyaml>=6,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["tadoss*"]

[tool.setuptools.package-data]
tadoss = ["contract/*.json", "contract/*.md"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "SIM", "TD", "PERF"]
ignore = ["TD003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.coverage.run]
source = ["tadoss"]
branch = true
omit = ["tadoss/__main__.py"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["tadoss"]
