version: '3'
vars:
  OPERATOR_IMAGE: '{{.OPERATOR_IMAGE | default ""}}'
tasks:
  init:
    desc: Create an environment; refuses to overwrite existing files
    requires: {vars: [NAME, DOMAIN, VERSION]}
    cmds: ['{{.ENV_COMMAND}} init --directory deploy/environments/{{.NAME}} --profile {{.PROFILE}} --domain {{.DOMAIN}} --version {{.VERSION}} {{if .OPERATOR_IMAGE}}--operator-image "{{.OPERATOR_IMAGE}}"{{end}}']
  apply:
    desc: Apply platform, operator and selected instances
    cmds: ['{{.ENV_COMMAND}} apply {{.ENV_ARGS}}']
  diff:
    desc: Show changes; fail on rendering or Kubernetes errors
    cmds: ['{{.ENV_COMMAND}} diff {{.ENV_ARGS}}']
  assert-clean:
    desc: Fail if any platform, operator or instance change remains
    cmds: ['{{.ENV_COMMAND}} diff --strict {{.ENV_ARGS}}']
  wait:
    desc: Wait for the selected generation and defaults revision
    cmds: ['{{.ENV_COMMAND}} wait {{.ENV_ARGS}}']
  status:
    desc: Show instance status without reading credentials
    cmds: ['{{.ENV_COMMAND}} status {{.ENV_ARGS}}']
  summary:
    desc: Show selected instances and readiness
    cmds: ['{{.ENV_COMMAND}} summary {{.ENV_ARGS}}']
  credentials:
    desc: Explicitly retrieve the selected instance API token
    requires: {vars: [INSTANCE]}
    cmds: ['{{.ENV_COMMAND}} credentials {{.ENV_ARGS}}']
