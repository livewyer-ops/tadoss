version: '3'
set: [errexit, nounset, pipefail]
vars:
  STRICT: '{{.STRICT | default "false"}}'
  TIMEOUT: '{{.TIMEOUT | default "600s"}}'
tasks:
  apply:
    desc: Apply platform, operator and selected instances
    cmds:
      - python3 scripts/platform_preflight.py --kubeconfig {{.KUBECONFIG | shellQuote}} --values {{.ENV_DIR | shellQuote}}/platform-values.yaml
      - helmfile --allow-no-matching-release --kubeconfig {{.KUBECONFIG | shellQuote}} --file deploy/platform/helmfile.yaml.gotmpl --state-values-file {{.ENV_DIR | shellQuote}}/platform-values.yaml sync
      - kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} apply --server-side -k {{.ENV_DIR | shellQuote}}/operator
      - kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} rollout status deployment/tadoss-operator -n tadoss-system --timeout={{.TIMEOUT | shellQuote}}
      - kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} wait --for=condition=Established crd/tadosses.tadoss.livewyer.io --timeout={{.TIMEOUT | shellQuote}}
      - kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} apply --server-side -k {{.ENV_DIR | shellQuote}}{{if .INSTANCE}}/instances/{{.INSTANCE | shellQuote}}{{end}}
  diff:
    desc: Show changes; STRICT=true also fails on differences
    cmds:
      - 'helmfile --allow-no-matching-release --kubeconfig {{.KUBECONFIG | shellQuote}} --file deploy/platform/helmfile.yaml.gotmpl --state-values-file {{.ENV_DIR | shellQuote}}/platform-values.yaml diff --detailed-exitcode || { code=$?; test {{.STRICT | shellQuote}} = false && test "$code" -eq 2; }'
      - 'kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} diff --server-side -k {{.ENV_DIR | shellQuote}}/operator || { code=$?; test {{.STRICT | shellQuote}} = false && test "$code" -eq 1; }'
      - 'kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} diff --server-side -k {{.ENV_DIR | shellQuote}}{{if .INSTANCE}}/instances/{{.INSTANCE | shellQuote}}{{end}} || { code=$?; test {{.STRICT | shellQuote}} = false && test "$code" -eq 1; }'
  wait:
    desc: Wait for the selected generation and defaults revision
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} rollout status deployment/tadoss-operator -n tadoss-system --timeout={{.TIMEOUT | shellQuote}}
      - |
        revision=$(sha256sum {{.ENV_DIR | shellQuote}}/operator/defaults.yaml | cut -d' ' -f1)
        kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} kustomize {{.ENV_DIR | shellQuote}}{{if .INSTANCE}}/instances/{{.INSTANCE | shellQuote}}{{end}} | yq -e -r -N 'select(.kind == "Tadoss") | .metadata.namespace + "/" + .metadata.name' |
        while IFS=/ read -r namespace name; do
          generation=$(kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} -n "$namespace" get "tadoss/$name" -o jsonpath='{.metadata.generation}')
          kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} -n "$namespace" wait "tadoss/$name" --for="jsonpath={.status.observedGeneration}=$generation" --timeout={{.TIMEOUT | shellQuote}}
          kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} -n "$namespace" wait "tadoss/$name" --for="jsonpath={.status.appliedDefaultsRevision}=$revision" --timeout={{.TIMEOUT | shellQuote}}
          kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} -n "$namespace" wait "tadoss/$name" --for=condition=Ready --timeout={{.TIMEOUT | shellQuote}}
        done
  status:
    desc: Show selected instance status without reading credentials
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} kustomize {{.ENV_DIR | shellQuote}}{{if .INSTANCE}}/instances/{{.INSTANCE | shellQuote}}{{end}} | yq 'select(.kind == "Tadoss")' | kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} get -f - -o yaml
  credentials:
    desc: Print shell exports for an instance's kubeconfig, API URL and authentication
    silent: true
    vars:
      AUTH_METHOD: '{{.AUTH_METHOD | default "auto"}}'
      API_URL: '{{.API_URL | default ""}}'
    requires:
      vars: [INSTANCE, KUBECONFIG]
    preconditions:
      - sh: test -n {{.INSTANCE | shellQuote}} && test -n {{.KUBECONFIG | shellQuote}}
        msg: Specify a nonempty INSTANCE and KUBECONFIG
    cmds:
      - |
        kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} kustomize {{.ENV_DIR | shellQuote}} |
          TADOSS_INSTANCE={{.INSTANCE | shellQuote}} yq -e 'select(.kind == "Tadoss" and .metadata.name == strenv(TADOSS_INSTANCE))' |
          kubectl --kubeconfig {{.KUBECONFIG | shellQuote}} get -f - -o json |
          python3 scripts/env_credentials.py --kubeconfig {{.KUBECONFIG | shellQuote}} --auth-method {{.AUTH_METHOD | shellQuote}} --api-url {{.API_URL | shellQuote}}
