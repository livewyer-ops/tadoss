version: '3'
tasks:
  all:
    cmds:
      - uv run --project src --frozen ruff check --config src/pyproject.toml src/app tests scripts operator/test/chainsaw/fixtures
      - uv run --project src --frozen ruff format --config src/pyproject.toml --check src/app tests scripts operator/test/chainsaw/fixtures
      - cd src && uv run --frozen pyright
      - actionlint
  fmt:
    desc: Format maintained Python and Go code
    cmds:
      - uv run --project src ruff check --config src/pyproject.toml --fix src/app tests scripts operator/test/chainsaw/fixtures
      - uv run --project src ruff format --config src/pyproject.toml src/app tests scripts operator/test/chainsaw/fixtures
      - cd operator && make fmt
