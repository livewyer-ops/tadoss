version: '3'
tasks:
  fast:
    desc: Run checks that do not require PostgreSQL or Kubernetes
    cmds: ["uv run --project src --frozen pytest -q tests/test_settings.py tests/test_environment.py tests/test_vendor_spec.py tests/test_support_bundle.py tests/test_release.py tests/test_webhook_delivery.py"]
  all:
    desc: Run Python tests against isolated PostgreSQL schemas
    cmds:
      - task: :dev:db
      - uv run --project src --frozen pytest -q tests --junitxml=reports/python.xml
  tads:
    desc: Run current TADS contract and semantic checks
    cmds:
      - task: :dev:db
      - uv run --project src --frozen python scripts/check_contract.py
      - uv run --project src --frozen pytest -q tests/test_api.py tests/test_background.py tests/test_auth.py --junitxml=reports/tads.xml
  manifests:
    desc: Validate native installation and environment rendering
    cmds:
      - kubectl kustomize deploy/operator > /dev/null
      - for: [local-kind, edge, single-server, multi-server]
        cmd: 'kubectl kustomize deploy/environments/{{.ITEM}}/operator > /dev/null && kubectl kustomize deploy/environments/{{.ITEM}} > /dev/null'
      - helm lint deploy/charts/tadoss-issuer
      - helm lint deploy/charts/tadoss-issuer -f deploy/charts/tadoss-issuer/ci/acme-values.yaml
      - uv run --project src --frozen python scripts/check_contract.py
      - uv run --project src --frozen python scripts/check_docs.py
