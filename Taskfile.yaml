version: '3'
set: [errexit, nounset, pipefail]
vars:
  PROFILE: '{{.PROFILE | default "local-kind"}}'
  ENV: '{{.ENV | default "local-kind"}}'
  ENV_DIR: '{{.ENV_DIR | default (printf "%s/deploy/environments/%s" .ROOT_DIR .ENV)}}'
  INSTANCE: '{{.INSTANCE | default ""}}'
  CLUSTER: '{{.CLUSTER | default "tadoss"}}'
  KUBECONFIG: '{{.KUBECONFIG | default (printf "%s/.local/%s.kubeconfig" .ROOT_DIR .CLUSTER)}}'
  BUILD_ID:
    sh: date -u +%Y%m%d%H%M%S%N
  IMAGE_TAG: '{{.IMAGE_TAG | default (printf "dev-%s" .BUILD_ID)}}'
env:
  AQUA_CONFIG: '{{.ROOT_DIR}}/aqua.yml'
  HELM_DATA_HOME: '{{.ROOT_DIR}}/.local/helm'
  HELM_PLUGINS: '{{.ROOT_DIR}}/.local/helm/plugins'
  PATH: '{{.HOME}}/.local/share/aquaproj-aqua/bin:{{.PATH}}'
includes:
  dev: .tasks/dev.yaml
  env: .tasks/env.yaml
  auth: .tasks/auth.yaml
  operator: .tasks/operator.yaml
  test: .tasks/test.yaml
  lint: .tasks/lint.yaml
  kind: .tasks/kind.yaml
  images: .tasks/images.yaml
  security: .tasks/security.yaml
  release: .tasks/release.yaml
tasks:
  default:
    cmds: [task --list]
  setup:
    desc: Install locked development dependencies
    cmds:
      - uv sync --project src --frozen --extra otel
      - task: dev:helm-diff
  check:
    desc: Run local checks used by CI
    cmds:
      - task: lint:all
      - task: test:all
      - task: operator:test
      - task: operator:lint
      - task: test:manifests
