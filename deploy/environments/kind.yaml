# Disposable Kind cluster. NodePorts 30080 and 30443 map to loopback 18080 and 18443 through
# deploy/kind/*.yaml. Task sets instance.spec.profile and images.tag for each run.
platform:
  traefik:
    values:
      service:
        type: NodePort
      ports:
        web:
          nodePort: 30080
        websecure:
          nodePort: 30443
tls:
  mode: selfSigned
instance:
  spec:
    ingress:
      host: api.tadoss.localtest.me
