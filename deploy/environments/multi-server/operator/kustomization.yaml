apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../operator
configMapGenerator:
- name: tadoss-instance-defaults
  namespace: tadoss-system
  files:
  - defaults.yaml
  options:
    immutable: true
    labels:
      app.kubernetes.io/name: tadoss-instance-defaults
      app.kubernetes.io/managed-by: kustomize
patches:
- patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: tadoss-operator\n\
    \  namespace: tadoss-system\nspec:\n  template:\n    spec:\n      containers:\n\
    \      - name: manager\n        env:\n        - name: TADOSS_INSTANCE_DEFAULTS\n\
    \          value: /etc/tadoss/defaults/defaults.yaml\n        volumeMounts:\n\
    \        - name: defaults\n          mountPath: /etc/tadoss/defaults\n       \
    \   readOnly: true\n      volumes:\n      - name: defaults\n        configMap:\n\
    \          name: tadoss-instance-defaults\n"
