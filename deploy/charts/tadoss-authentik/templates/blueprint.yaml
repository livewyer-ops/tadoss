apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.instance }}-authentik-blueprint
data:
  tadoss.yaml: |
    version: 1
    metadata:
      name: {{ .Values.instance }} OAuth2 access
    entries:
    {{- range $scope := list "read" "write" "delete" }}
      - model: authentik_providers_oauth2.scopemapping
        id: scope-{{ $scope }}
        identifiers: {scope_name: "tads-api/{{ $scope }}"}
        attrs:
          name: TADOSS {{ $scope }}
          expression: "return {}"
    {{- end }}
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers: {name: "{{ .Values.instance }}-api"}
        attrs:
          client_type: confidential
          client_id: !Env TADOSS_OAUTH_CLIENT_ID
          client_secret: !Env TADOSS_OAUTH_CLIENT_SECRET
          grant_types: [client_credentials]
          redirect_uris: []
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          issuer_mode: per_provider
          access_token_validity: minutes=5
          property_mappings: [!KeyOf scope-read, !KeyOf scope-write, !KeyOf scope-delete]
      - model: authentik_core.application
        identifiers: {slug: "{{ .Values.instance }}"}
        attrs:
          name: TADOSS API
          provider: !KeyOf provider
