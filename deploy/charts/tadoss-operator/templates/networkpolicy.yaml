{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tadoss-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tadoss-operator.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Probes come from the kubelet, which some network plugins do not exempt.
    - ports:
        - port: health
    {{- if and .Values.metrics.enabled .Values.networkPolicy.metricsFrom }}
    - from: {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: metrics
    {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
        - port: 6443
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
