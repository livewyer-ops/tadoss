{{- if .Values.rbac.create }}
{{- $rules := (.Files.Get "files/role.yaml" | fromYaml).rules }}
{{- $namespaced := list }}
{{- $clusterScoped := list }}
{{- range $rules }}
{{- if or (has "namespaces" .resources) (has "authentication.k8s.io" .apiGroups) (has "authorization.k8s.io" .apiGroups) }}
{{- $clusterScoped = append $clusterScoped . }}
{{- else }}
{{- $namespaced = append $namespaced . }}
{{- end }}
{{- end }}
{{- if .Values.watchNamespaces }}
{{- range .Values.watchNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tadoss-operator.fullname" $ }}
  namespace: {{ . }}
  labels: {{- include "tadoss-operator.labels" $ | nindent 4 }}
rules: {{- toYaml $namespaced | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tadoss-operator.fullname" $ }}
  namespace: {{ . }}
  labels: {{- include "tadoss-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tadoss-operator.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tadoss-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
# Namespace termination and metrics authentication stay cluster-wide when
# reconciliation is scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tadoss-operator.fullname" . }}
  labels: {{- include "tadoss-operator.labels" . | nindent 4 }}
rules: {{- toYaml $clusterScoped | nindent 2 }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tadoss-operator.fullname" . }}
  labels: {{- include "tadoss-operator.labels" . | nindent 4 }}
rules: {{- toYaml $rules | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tadoss-operator.fullname" . }}
  labels: {{- include "tadoss-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tadoss-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tadoss-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election needs a lease and events in the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tadoss-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tadoss-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "tadoss-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
