{{- $servers := dict "production" "https://acme-v02.api.letsencrypt.org/directory" "staging" "https://acme-staging-v02.api.letsencrypt.org/directory" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ required "name is required" .Values.name }}
spec:
{{- if eq .Values.mode "selfSigned" }}
  selfSigned: {}
{{- else if eq .Values.mode "acme" }}
  acme:
    email: {{ required "acme.email is required for ACME" .Values.acme.email | quote }}
    server: {{ get $servers .Values.acme.server | default .Values.acme.server }}
    privateKeySecretRef:
      name: {{ .Values.name }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.acme.ingressClassName }}
{{- else }}
{{- fail (printf "mode must be selfSigned or acme, got %q" .Values.mode) }}
{{- end }}
