apiVersion: v1
kind: Namespace
metadata:
  name: tadoss-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tadoss-operator
  namespace: tadoss-system
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tadoss-system-tadoss-operator-metrics-reader
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tadoss-system-tadoss-operator-manager
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tadoss-operator
subjects:
- kind: ServiceAccount
  name: tadoss-operator
  namespace: tadoss-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tadoss-operator-leader-election
  namespace: tadoss-system
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ''
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tadoss-operator-leader-election
  namespace: tadoss-system
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tadoss-operator-leader-election
subjects:
- kind: ServiceAccount
  name: tadoss-operator
  namespace: tadoss-system
---
apiVersion: v1
kind: Service
metadata:
  name: tadoss-operator-metrics
  namespace: tadoss-system
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
  ports:
  - name: metrics
    port: 8443
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tadoss-operator
  namespace: tadoss-system
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tadoss-operator
      app.kubernetes.io/instance: tadoss-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tadoss-operator
        app.kubernetes.io/instance: tadoss-operator
    spec:
      serviceAccountName: tadoss-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: livewyer/tadoss-operator:0.1.0-rc1
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect=true
        - --metrics-bind-address=:8443
        - --metrics-secure=true
        - --zap-log-level=info
        - --zap-encoder=json
        ports:
        - name: metrics
          containerPort: 8443
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tadoss-system-tadoss-operator-deletion-protection
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - tadoss.livewyer.io
      apiVersions:
      - v1alpha1
      operations:
      - DELETE
      resources:
      - tadosses
  matchConditions:
  - name: namespace-not-terminating
    expression: namespaceObject == null || !has(namespaceObject.metadata.deletionTimestamp)
  - name: not-namespace-controller
    expression: request.userInfo.username != 'system:serviceaccount:kube-system:namespace-controller'
  validations:
  - expression: has(oldObject.spec.deletionProtection) && oldObject.spec.deletionProtection
      == false
    message: Set spec.deletionProtection=false before deleting a Tadoss instance
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tadoss-system-tadoss-operator-deletion-protection
  labels:
    app.kubernetes.io/name: tadoss-operator
    app.kubernetes.io/instance: tadoss-operator
    app.kubernetes.io/version: 0.1.0-rc1
    app.kubernetes.io/managed-by: kustomize
spec:
  policyName: tadoss-system-tadoss-operator-deletion-protection
  validationActions:
  - Deny
